name: document_assistant
description: A mobile-first Android app that helps users understand documents and generate contextual outputs.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.1.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  in_app_purchase: ^3.2.0
  file_picker: ">=10.3.3 <11.0.0"
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
